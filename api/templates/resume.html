{% extends "base.html" %}
{% block title %}Resume{% endblock %}
{% block content %}
    <div class="image-container"></div>
        <img src="{{ url_for('static', filename='images/1.png') }}" alt="First Image">
        <img src="{{ url_for('static', filename='images/2.png') }}" alt="Second Image">
        <img src="{{ url_for('static', filename='images/3.png') }}" alt="Third Image">
    </div>

    <style>
        .image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
    <div class="download-container">
        <a href="#" class="download-button" onclick="downloadAsPDF()"></a>
            Download Resume
        </a>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script>
            async function downloadAsPDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const images = [
                    "{{ url_for('static', filename='images/1.png') }}",
                    "{{ url_for('static', filename='images/2.png') }}",
                    "{{ url_for('static', filename='images/3.png') }}"
                ];

                for (let i = 0; i < images.length; i++) {
                    const img = await loadImage(images[i]);
                    const imgWidth = doc.internal.pageSize.getWidth();
                    const imgHeight = (img.height * imgWidth) / img.width;
                    
                    if (i > 0) doc.addPage();
                    doc.addImage(img, 'PNG', 0, 0, imgWidth, imgHeight);
                }

                doc.save('resume.pdf');
            }

            function loadImage(url) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = url;
                });
            }
        </script>
        </a>
    </div>

    <style>
        .download-container {
            text-align: center;
            margin: 20px;
        }
        .download-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .download-button:hover {
            background-color: #d3d3d3;
        }
    </style>
{% endblock %}

{% extends "base.html" %}
{% block title %}Resume{% endblock %}
{% block content %}
    <div class="image-container">
        <embed src="{{ url_for('static', filename='Charles Galea_Resume.pdf') }}" type="application/pdf" width="100%" height="600px">
    </div>

    <style>
        .image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
    <div class="download-container">
        <a href="#" class="download-button" onclick="downloadAll()">
            Download Resume
        </a>
        <script>
            function downloadAll() {
            const images = [
                "{{ url_for('static', filename='images/1.png') }}",
                "{{ url_for('static', filename='images/2.png') }}",
                "{{ url_for('static', filename='images/3.png') }}"
            ];
            images.forEach((url, index) => {
                const link = document.createElement('a');
                link.href = url;
                link.download = `image${index + 1}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
            }
        </script>
        </a>
    </div>

    <style>
        .download-container {
            text-align: center;
            margin: 20px;
        }
        .download-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .download-button:hover {
            background-color: #d3d3d3;
        }
    </style>
{% endblock %}
